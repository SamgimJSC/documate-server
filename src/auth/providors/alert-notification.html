<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>문서 알림</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f4f6f8; padding: 40px 0"
    >
      <tr>
        <td align="center">
          <table
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 12px;
              overflow: hidden;
              box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            "
          >
            <!-- Header -->
            <tr>
              <td
                style="
                  background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
                  padding: 40px 48px;
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 28px;
                    font-weight: 700;
                    color: #ffffff;
                    letter-spacing: -0.5px;
                  "
                >
                  Documate
                </p>
                <p
                  style="
                    margin: 8px 0 0;
                    font-size: 14px;
                    color: rgba(255, 255, 255, 0.75);
                    letter-spacing: 0.5px;
                  "
                >
                  DOCUMENT ALERT
                </p>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding: 48px 48px 40px">
                <p
                  style="
                    margin: 0 0 8px;
                    font-size: 22px;
                    font-weight: 700;
                    color: #111827;
                    line-height: 1.3;
                  "
                >
                  {{TITLE}}
                </p>
                <p
                  style="
                    margin: 0 0 32px;
                    font-size: 15px;
                    color: #6b7280;
                    line-height: 1.6;
                  "
                >
                  설정하신 문서 알림이 도착했습니다.
                </p>

                <!-- Info Table -->
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="
                    background-color: #f9fafb;
                    border: 1px solid #e5e7eb;
                    border-radius: 8px;
                    margin-bottom: 32px;
                  "
                >
                  <tr>
                    <td style="padding: 20px 24px">
                      <table cellpadding="0" cellspacing="0" width="100%">
                        <tr>
                          <td
                            style="
                              font-size: 13px;
                              color: #6b7280;
                              padding-bottom: 12px;
                              width: 90px;
                              vertical-align: top;
                            "
                          >
                            알림 날짜
                          </td>
                          <td
                            style="
                              font-size: 13px;
                              font-weight: 600;
                              color: #111827;
                              padding-bottom: 12px;
                            "
                          >
                            {{NOTIFY_DATE}}
                          </td>
                        </tr>
                        {{REASON_ROW}}
                      </table>
                    </td>
                  </tr>
                </table>

                <!-- CTA Button -->
                <table cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      style="
                        background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
                        border-radius: 8px;
                      "
                    >
                      <a
                        href="{{DOC_URL}}"
                        target="_blank"
                        style="
                          display: inline-block;
                          padding: 14px 32px;
                          color: #ffffff;
                          font-size: 15px;
                          font-weight: 600;
                          text-decoration: none;
                          letter-spacing: -0.2px;
                        "
                      >
                        문서 확인하기 →
                      </a>
                    </td>
                  </tr>
                </table>

                <!-- Divider -->
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="margin: 32px 0 0"
                >
                  <tr>
                    <td style="border-top: 1px solid #e5e7eb"></td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Notice -->
            <tr>
              <td style="padding: 0 48px 40px">
                <table
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="
                    background-color: #eff6ff;
                    border-radius: 8px;
                    border-left: 4px solid #3b82f6;
                  "
                >
                  <tr>
                    <td style="padding: 14px 16px">
                      <p
                        style="
                          margin: 0;
                          font-size: 13px;
                          color: #1e40af;
                          line-height: 1.5;
                        "
                      >
                        알림을 더 이상 받고 싶지 않으시면 문서 상세 페이지에서 알림을 삭제해 주세요.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  background-color: #f9fafb;
                  padding: 24px 48px;
                  text-align: center;
                  border-top: 1px solid #e5e7eb;
                "
              >
                <p style="margin: 0 0 4px; font-size: 13px; color: #9ca3af">
                  이 이메일은 Documate에서 발송되었습니다.
                </p>
                <p style="margin: 0; font-size: 12px; color: #d1d5db">
                  &copy; 2026 Documate. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
